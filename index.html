  <style>
    /* --- PERFECT RESET --- */
    * {
      margin: 0;

    }
    
    html, body {
      background: #0a0a0a;

    /* --- MAIN CONTAINER --- */
    #main-container {

    }
    .title-bar .title {

<script>
// ============================================
// GIRIH 1 — PURE JS T-SHIRT EDITION
// ============================================

// --- DETERMINISTIC RANDOM GENERATOR ---
class RandomGenerator {
  constructor(seed) {
    this.seed = seed;
    this.state = seed;
  }
  rand() {
    let x = this.state;
    x ^= x << 13;
    x ^= x >> 17;
    x ^= x << 5;
    this.state = x;
    return (x >>> 0) / 4294967296;
  }
}

// --- STATE ---
const ratio = 1 / 1;
const prefix = 'Girih 1';
const features = {};
let seed = Date.now() + Math.random() * 1000000;
let rng = new RandomGenerator(seed);
let showingShirt = false;
let resizeTmr = null;
let thumbnailTaken = false;
let animated = false;
let nextFrame = null;

// --- URL PARAMS ---
const urlSearchParams = new URLSearchParams(window.location.search);
const urlParams = Object.fromEntries(urlSearchParams.entries());
let forceDownloaded = false;

// --- COLOR ARRAYS ---
const BackgroundColours1 = [
  '#CD5C5C', '#F08080', '#FA8072', '#E9967A', '#DC143C', '#FF0000', '#B22222',
  '#8B0000', '#FF69B4', '#FF1493', '#C71585', '#DB7093', '#FF6347', '#FF4500',
  '#FF8C00', '#FFA500', '#FFD700', '#BDB76B', '#00FF00', '#32CD32', '#2E8B57',
  '#006400', '#556B2F', '#6B8E23', '#BC8F8F', '#F4A460', '#DAA520', '#B8860B',
  '#D2691E', '#8B4513', '#A0522D', '#A52A2A', '#800000', '#696969', '#708090',
  '#2F4F4F', '#000000'
];

const BackgroundrNames1 = [
  'IndianRed', 'LightCoral', 'Salmon', 'DarkSalmon', 'Crimson', 'Red', 'FireBrick',
  'DarkRed', 'HotPink', 'DeepPink', 'MediumVioletRed', 'PaleVioletRed', 'Tomato',
  'OrangeRed', 'DarkOrange', 'Orange', 'Gold', 'DarkKhaki', 'Lime', 'LimeGreen',
  'SeaGreen', 'DarkGreen', 'DarkOliveGreen', 'OliveDrab', 'RosyBrown', 'SandyBrown',
  'Goldenrod', 'DarkGoldenrod', 'Chocolate', 'SaddleBrown', 'Sienna', 'Brown',
  'Maroon', 'DimGray', 'SlateGray', 'DarkSlateGray', 'Black'
];

const BackgroundColours2 = [
  '#FFFFE0', '#FFFACD', '#FFEFD5', '#F0E68C', '#E6E6FA', '#98FB98', '#E0FFFF',
  '#B0E0E6', '#FFF8DC', '#FFEBCD', '#F5DEB3', '#FFFAFA', '#F0FFF0', '#F5FFFA',
  '#F0FFFF', '#F0F8FF', '#F8F8FF', '#F5F5F5', '#FFF5EE', '#F5F5DC', '#FDF5E6',
  '#FFFAF0', '#FFFFF0', '#FAEBD7', '#FAF0E6', '#FFF0F5', '#FFE4E1', '#DCDCDC'
];

const BackgroundNames2 = [
  'LightYellow', 'LemonChiffon', 'PapayaWhip', 'Khaki', 'Lavender', 'PaleGreen',
  'LightCyan', 'PowderBlue', 'Cornsilk', 'BlanchedAlmond', 'Wheat', 'Snow',
  'HoneyDew', 'MintCream', 'Azure', 'AliceBlue', 'GhostWhite', 'WhiteSmoke',
  'SeaShell', 'Beige', 'OldLace', 'FloralWhite', 'Ivory', 'AntiqueWhite',
  'Linen', 'LavenderBlush', 'MistyRose', 'Gainsboro'
];

const foregroundColours = ['#663399', '#8A2BE2', '#6A5ACD', '#483D8B', '#5F9EA0', '#B0C4DE', '#00BFFF', '#1E90FF', '#0000FF', '#000080'];
const foregroundNames = ['RebeccaPurple', 'BlueViolet', 'SlateBlue', 'DarkSlateBlue', 'CadetBlue', 'SteelBlue', 'DeepSkyBlue', 'DodgerBlue', 'Blue', 'Navy'];
const girih = ['Umayyad mosque', 'Simple hexagram', 'Esreffoglu mosque'];

// --- SETUP ---
function setup() {
  const BackgroundIndex1 = Math.floor(rng.rand() * BackgroundColours1.length);
  const BackgroundIndex2 = Math.floor(rng.rand() * BackgroundColours2.length);
  const foregroundIndex = Math.floor(rng.rand() * foregroundColours.length);
  const girihIndex = Math.floor(rng.rand() * girih.length);

  features.backgroundColour = '#000000';
  features.BackgroundColour1 = BackgroundColours1[BackgroundIndex1];
  features.BackgroundColour2 = BackgroundColours2[BackgroundIndex2];
  features.foregroundColour = foregroundColours[foregroundIndex];
  features.girihtype = girihIndex;
  features.backgroundName1 = BackgroundrNames1[BackgroundIndex1];
  features.backgroundName2 = BackgroundNames2[BackgroundIndex2];
  features.foregroundName = foregroundNames[foregroundIndex];
  features.girihName = girih[girihIndex];
}

// --- DRAWING FUNCTIONS ---
function motif1(ctx, a, b, color, linewidth, shadowblur) {
  let angle = Math.PI / 6;
  ctx.beginPath();
  for (let i = 0; i < 12; i++) {
    let sx, sy;
    if (i % 2 === 0) {
      sx = Math.cos(i * angle) * b;
      sy = Math.sin(i * angle) * b;
    } else {
      sx = Math.cos(i * angle) * a;
      sy = Math.sin(i * angle) * a;
    }
    ctx.lineTo(sx, sy);
  }
  ctx.closePath();
  ctx.shadowBlur = shadowblur;
  ctx.shadowColor = color;
  ctx.strokeStyle = color;
  ctx.lineWidth = linewidth;
  ctx.stroke();
}

function motif2(ctx, a, b, color, linewidth, shadowblur) {
  let x, y;
  ctx.beginPath();
  for (let i = 0; i < 12; i++) {
    if (i % 2 === 0) {
      x = a * Math.cos(Math.PI * i / 6);
      y = a * Math.sin(Math.PI * i / 6);
    } else {
      x = b * Math.cos(Math.PI * i / 6);
      y = b * Math.sin(Math.PI * i / 6);
    }
    ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.shadowBlur = shadowblur;
  ctx.shadowColor = color;
  ctx.strokeStyle = color;
  ctx.lineWidth = linewidth;
  ctx.stroke();
}

function motif3(ctx, a, color, linewidth, shadowblur) {
  let x0, y0, x1, y1, x2, y2, x3, y3;
  for (let i = 0; i < 6; i++) {
    ctx.save();
    ctx.rotate(i * Math.PI / 3);
    ctx.translate(a * Math.cos(Math.PI / 6) * 2, 0);
    x0 = a * Math.cos(Math.PI / 6);
    y0 = a * Math.sin(Math.PI / 6);
    x1 = -x0;
    y1 = -y0;
    x2 = x0;
    y2 = y1;
    x3 = x1;
    y3 = y0;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.shadowBlur = shadowblur;
    ctx.shadowColor = color;
    ctx.strokeStyle = color;
    ctx.lineWidth = linewidth;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x3, y3);
    ctx.stroke();
    ctx.restore();
  }
}

function star1(ctx, a, height, width, color, linewidth, shadowblur) {
  let b = a * (Math.sin(Math.PI * 3 / 4) / Math.sin(Math.PI / 12));
  let dx = 2 * b;
  let dy = 2 * b * Math.cos(Math.PI / 6);
  let nRow = Math.ceil(height / dy) + 1;
  let nCol = Math.ceil(width / dx) + 1;
  for (let r = 0; r < nRow; r++) {
    for (let c = 0; c < nCol; c++) {
      ctx.save();
      if (r % 2 === 0) {
        ctx.translate(c * dx, r * dy);
      } else {
        ctx.translate(c * dx + b, r * dy);
      }
      motif1(ctx, a, b, color, linewidth, shadowblur);
      ctx.restore();
    }
  }
}

function star2(ctx, a, height, width, color, linewidth, shadowblur) {
  let b = a * 2 * Math.cos(Math.PI / 6);
  let dx = 3 * a;
  let dy = 4 * a * Math.cos(Math.PI / 6);
  let nRow = Math.ceil(height / dy) + 1;
  let nCol = Math.ceil(width / dx) + 1;
  for (let c = 0; c < nCol; c++) {
    for (let r = 0; r < nRow; r++) {
      ctx.save();
      ctx.translate(dx * c, dy * r);
      if (c % 2 === 0) {
        ctx.translate(0, dy * 0.5);
      }
      motif2(ctx, a, b, color, linewidth, shadowblur);
      ctx.restore();
    }
  }
}

function star3(ctx, a, height, width, color, linewidth, shadowblur) {
  let dx = 6 * a * Math.cos(Math.PI / 6);
  let dy = 4.5 * a;
  let doff = 0.5 * dx;
  let nCol = Math.ceil(width / dx) + 1;
  let nRow = Math.ceil(height / dy) + 1;
  for (let c = 0; c < nCol; c++) {
    for (let r = 0; r < nRow; r++) {
      ctx.save();
      if (r % 2 === 0) {
        ctx.translate(doff, 0);
      }
      ctx.translate(c * dx, r * dy);
      motif3(ctx, a, color, linewidth, shadowblur);
      ctx.restore();
    }
  }
}

function drawTree(ctx, startX, startY, length, angle, depth, branchWidth, color1, color2) {
  const maxBranch = 5;
  const maxAngle = 2 * Math.PI;
  const endX = startX + length * Math.cos(angle);
  const endY = startY + length * Math.sin(angle);
  ctx.beginPath();
  ctx.moveTo(startX, startY);
  ctx.lineTo(endX, endY);
  ctx.lineWidth = branchWidth;
  ctx.lineCap = 'round';
  ctx.strokeStyle = (depth <= 1) ? color1 : color2;
  ctx.stroke();
  const newDepth = depth - 1;
  if (!newDepth) return;
  const subBranches = Math.floor(rng.rand() * (maxBranch - 1)) + 1;
  const newBranchWidth = branchWidth * 1.1;
  for (let i = 0; i < subBranches; i++) {
    const newAngle = angle - maxAngle + rng.rand() * maxAngle * 2;
    const newLength = length * 1.5;
    drawTree(ctx, endX, endY, newLength, newAngle, newDepth, newBranchWidth, color1, color2);
  }
}

// --- MAIN DRAW ---
function drawCanvas() {
  window.cancelAnimationFrame(nextFrame);

  const canvas = document.getElementById('target');
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;

  ctx.fillStyle = features.backgroundColour;
  ctx.fillRect(0, 0, w, h);

  const Color1 = features.BackgroundColour2;
  const Color2 = features.BackgroundColour1;
  const color3 = features.foregroundColour;

  const X1 = w / 2;
  const Y1 = h / 2;
  const Angle1 = -Math.PI / 4;
  drawTree(ctx, X1, Y1, w / 3, Angle1, 12, w / 2500, Color1, Color2);

  const Q = features.girihtype;
  const a = rng.rand() * w / 10 + w / 20;
  const T = rng.rand() * w / 100 + w / 100;

  if (Q === 0) {
    star1(ctx, a, h, w, color3, T, w / 100);
  } else if (Q === 1) {
    star2(ctx, a, h, w, color3, T, w / 100);
  } else if (Q === 2) {
    star3(ctx, a, h, w, color3, T, w / 100);
  }

  if ('forceDownload' in urlParams && forceDownloaded === false) {
    forceDownloaded = true;
    autoDownloadCanvas();
    if (window.parent) {
      window.parent.postMessage('forceDownloaded', '*');
    }
  }

  if (animated) {
    nextFrame = window.requestAnimationFrame(drawCanvas);
  }

  updateUI();
}

// --- UPDATE UI ---
function updateUI() {
  document.getElementById('seedDisplay').textContent = String(seed).slice(0, 8);
  document.getElementById('styleDisplay').textContent = features.girihName || '---';
}

// --- REGENERATE ---
function regenerate() {
  seed = Date.now() + Math.random() * 1000000;
  rng = new RandomGenerator(seed);
  thumbnailTaken = false;
  
  setup();
  
  if (showingShirt) {
    toggleShirt();
  }
  
  layoutCanvas();
}

// --- TOGGLE SHIRT ---
function toggleShirt() {
  showingShirt = !showingShirt;
  const canvas = document.getElementById('target');
  const shirtMockup = document.getElementById('shirt-mockup');
  const shirtToggle = document.getElementById('shirtToggle');
  
  if (showingShirt) {
    canvas.classList.add('hidden');
    shirtMockup.classList.add('active');
    shirtToggle.classList.add('active');
    shirtToggle.innerHTML = '<span class="icon">◷</span> artwork';
  } else {
    canvas.classList.remove('hidden');
    shirtMockup.classList.remove('active');
    shirtToggle.classList.remove('active');
    shirtToggle.innerHTML = '<span class="icon">◷</span> apparel';
  }
}

// --- DOWNLOAD ---
function autoDownloadCanvas() {
  const canvas = document.getElementById('target');
  const link = document.createElement('a');
  
  const seedStr = String(seed).slice(0, 8);
  link.download = prefix + '_Seed' + seedStr + '.png';
  
  if (showingShirt) {
    link.href = document.getElementById('shirt-mockup').src;
  } else {
    link.href = canvas.toDataURL('image/png', 1.0);
  }
  link.click();
}

// --- LAYOUT CANVAS ---
function layoutCanvas() {
  window.cancelAnimationFrame(nextFrame);
  
  const container = document.getElementById('canvas-container');
  const containerRect = container.getBoundingClientRect();
  let maxWidth = containerRect.width;
  let maxHeight = containerRect.height;
  
  maxWidth = Math.max(maxWidth, 80);
  maxHeight = Math.max(maxHeight, 80);
  
  let cWidth = maxWidth;
  let cHeight = cWidth / ratio;
  
  if (cHeight > maxHeight) {
    cHeight = maxHeight;
    cWidth = maxHeight * ratio;
  }
  
  cWidth = Math.max(cWidth, 80);
  cHeight = Math.max(cHeight, 80);
  
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  
  let targetWidth = cWidth * dpr;
  let targetHeight = cHeight * dpr;
  
  if ('forceWidth' in urlParams) {
    targetWidth = parseInt(urlParams.forceWidth);
    targetHeight = Math.floor(targetWidth / ratio);
    dpr = 1;
  }
  
  const canvas = document.getElementById('target');
  canvas.width = targetWidth;
  canvas.height = targetHeight;
  canvas.style.width = cWidth + 'px';
  canvas.style.height = cHeight + 'px';
  
  const shirtMockup = document.getElementById('shirt-mockup');
  shirtMockup.style.width = cWidth + 'px';
  shirtMockup.style.height = cHeight + 'px';
  
  drawCanvas();
}

// --- RESIZE ---
function handleResize() {
  clearTimeout(resizeTmr);
  resizeTmr = setTimeout(() => {
    layoutCanvas();
  }, 100);
}

// --- KEYBOARD ---
document.addEventListener('keydown', function(e) {
  if (e.key === 's' || e.key === 'S') {
    e.preventDefault();
    autoDownloadCanvas();
  }
  if (e.key === 'r' || e.key === 'R') {
    e.preventDefault();
    regenerate();
  }
  if (e.key === 't' || e.key === 'T') {
    e.preventDefault();
    toggleShirt();
  }
});

// --- CONTROLS ---
document.getElementById('controlsBar').addEventListener('click', regenerate);
document.getElementById('controlsBar').addEventListener('touchend', function(e) {
  e.preventDefault();
  regenerate();
});

document.getElementById('shirtToggle').addEventListener('click', toggleShirt);
document.getElementById('shirtToggle').addEventListener('touchend', function(e) {
  e.preventDefault();
  toggleShirt();
});

// --- WINDOW ---
window.addEventListener('resize', handleResize);
window.addEventListener('orientationchange', function() {
  setTimeout(handleResize, 400);
});

// --- VISIBILITY ---
document.addEventListener('visibilitychange', function() {
  if (!document.hidden) {
    setTimeout(() => {
      if (!showingShirt) {
        drawCanvas();
      }
    }, 100);
  }
});

// --- INIT ---
function init() {
  setup();
  layoutCanvas();
  updateUI();
  
  console.log('Girih 1 — Pure JS T-Shirt Edition');
  console.log('◷ Press T to toggle apparel view');
  console.log('Press S to save');
  console.log('Press R to regenerate');
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

// Expose functions globally
window.regenerate = regenerate;
window.autoDownloadCanvas = autoDownloadCanvas;
window.toggleShirt = toggleShirt;
window.drawCanvas = drawCanvas;
window.layoutCanvas = layoutCanvas;
</script>
</body>
</html>
